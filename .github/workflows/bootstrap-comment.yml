name: Bootstrap request comment

on:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number receiving the bootstrap request
        required: true
        type: number

permissions:
  issues: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.payload.inputs.issue
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: [
                '@hhaa12321 Please implement issue #1 in this repository.',
                '',
                'Fix the service status process detection so a live DSH process is recognized when `ps` reports `ucomm=MainThread` and its executable arguments begin with `node` followed by the DSH CLI. Keep the match anchored to the executable/CLI arguments so an unrelated process that merely contains `--profile superagent` does not count.',
                '',
                'Add a focused regression test in `tests/service-script.spec.ts`. Run the service-script test and `pnpm check`. Open a pull request from an `agent/...` branch against `main`.',
              ].join('\n'),
            })
